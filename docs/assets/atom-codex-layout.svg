<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title description">
  <title id="title">MIDI controller pad layout</title>
  <desc id="description">An unbranded front-view vector of a MIDI controller with four rotary controls, sixteen square RGB pads, and narrow button columns.</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48494b"/>
      <stop offset="0.5" stop-color="#383739"/>
      <stop offset="1" stop-color="#2d2d30"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a0a5a7"/>
      <stop offset="0.45" stop-color="#7e8486"/>
      <stop offset="1" stop-color="#686e71"/>
    </linearGradient>
    <radialGradient id="encoderFace" cx="38%" cy="31%" r="72%">
      <stop offset="0" stop-color="#5c5c5f"/>
      <stop offset="0.46" stop-color="#3a3a3d"/>
      <stop offset="1" stop-color="#202023"/>
    </radialGradient>
    <radialGradient id="encoderCenter" cx="37%" cy="31%" r="72%">
      <stop offset="0" stop-color="#555559"/>
      <stop offset="1" stop-color="#29292c"/>
    </radialGradient>
    <radialGradient id="padShine">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orangeButton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc15d"/>
      <stop offset="0.55" stop-color="#ff9c27"/>
      <stop offset="1" stop-color="#ee7d05"/>
    </linearGradient>
    <linearGradient id="redButton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7771"/>
      <stop offset="0.55" stop-color="#ff493c"/>
      <stop offset="1" stop-color="#e82b20"/>
    </linearGradient>
    <linearGradient id="greenButton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aeba0"/>
      <stop offset="0.55" stop-color="#61d86b"/>
      <stop offset="1" stop-color="#39ba48"/>
    </linearGradient>
    <linearGradient id="blueButton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#91d9ff"/>
      <stop offset="0.55" stop-color="#4ebcff"/>
      <stop offset="1" stop-color="#2395dd"/>
    </linearGradient>

    <filter id="deviceShadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#111827" flood-opacity="0.28"/>
    </filter>
    <filter id="controlShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="2" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.56"/>
    </filter>
    <filter id="padGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <g id="encoder">
      <circle r="72" fill="#57585a" fill-opacity="0.66" filter="url(#controlShadow)"/>
      <circle r="58" fill="url(#encoderFace)" stroke="#171719" stroke-width="3"/>
      <circle r="37" fill="url(#encoderCenter)"/>
      <path d="M-38 -36 A52 52 0 0 1 37 -37" fill="none" stroke="#858588" stroke-opacity="0.28" stroke-width="2"/>
    </g>
    <g id="litPad">
      <rect x="2" y="4" width="158" height="158" rx="5" fill="#111" filter="url(#controlShadow)"/>
      <rect width="160" height="160" rx="5" fill="#16171a" stroke="#202227" stroke-width="2"/>
      <rect x="4" y="4" width="152" height="152" rx="3" fill="currentColor" stroke="currentColor" stroke-width="2"/>
      <circle cx="80" cy="82" r="57" fill="url(#padShine)"/>
      <path d="M7 151 H153 M153 7 V151" stroke="#17191d" stroke-opacity="0.34" stroke-width="3"/>
      <path d="M7 7 H153" stroke="#fff" stroke-opacity="0.24" stroke-width="2"/>
    </g>
    <g id="offPad">
      <rect x="2" y="4" width="158" height="158" rx="5" fill="#111" filter="url(#controlShadow)"/>
      <rect width="160" height="160" rx="5" fill="#15171a" stroke="#21242a" stroke-width="2"/>
      <rect x="4" y="4" width="152" height="152" rx="3" fill="#1b1d21" stroke="#4b5159" stroke-width="2"/>
      <path d="M7 7 H153" stroke="#9299a2" stroke-opacity="0.16" stroke-width="2"/>
    </g>
    <g id="orangeControl"><rect width="75" height="47" rx="6" fill="url(#orangeButton)" stroke="#8c4a05" stroke-width="2" filter="url(#controlShadow)"/><path d="M8 4 H67" stroke="#fff" stroke-opacity="0.38" stroke-width="2" stroke-linecap="round"/></g>
    <g id="redControl"><rect width="75" height="47" rx="6" fill="url(#redButton)" stroke="#8d1a13" stroke-width="2" filter="url(#controlShadow)"/><path d="M8 4 H67" stroke="#fff" stroke-opacity="0.34" stroke-width="2" stroke-linecap="round"/></g>
    <g id="greenControl"><rect width="75" height="47" rx="6" fill="url(#greenButton)" stroke="#1c7730" stroke-width="2" filter="url(#controlShadow)"/><path d="M8 4 H67" stroke="#fff" stroke-opacity="0.36" stroke-width="2" stroke-linecap="round"/></g>
    <g id="blueControl"><rect width="75" height="47" rx="6" fill="url(#blueButton)" stroke="#116696" stroke-width="2" filter="url(#controlShadow)"/><path d="M8 4 H67" stroke="#fff" stroke-opacity="0.38" stroke-width="2" stroke-linecap="round"/></g>
    <g id="shiftControl"><rect width="75" height="47" rx="6" fill="#101113" stroke="#ff9b28" stroke-width="4" filter="url(#controlShadow)"/></g>

    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .encoder-number { fill: #f2f2f1; font-size: 21px; font-weight: 500; text-anchor: middle; }
      .group-box { fill: #2f2f31; stroke: #f3f3ef; stroke-width: 2; }
      .group-head { fill: #f3f3ef; }
      .group-title { fill: #454547; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .control-label { fill: #222225; font-size: 12px; font-weight: 650; text-anchor: middle; dominant-baseline: middle; }
      .control-label.small { font-size: 9px; }
      .control-label.light { fill: #fff; }
      .number-box { fill: #20252c; fill-opacity: 0.88; }
      .pad-number { fill: #fff; font-size: 15px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
      .pad-name { fill: #162033; font-size: 15px; font-weight: 800; text-anchor: start; }
      .pad-state { fill: #27334a; font-size: 8.5px; font-weight: 750; letter-spacing: 1.2px; text-anchor: start; }
      .off-name { fill: #6f7884; font-size: 14px; font-weight: 750; text-anchor: start; }
      .quick-label { fill: #f0f0ee; font-size: 10px; }
    </style>
  </defs>

  <g filter="url(#deviceShadow)">
    <rect x="48" y="38" width="1104" height="1068" rx="19" fill="url(#rim)"/>
    <rect x="66" y="56" width="1068" height="1032" rx="13" fill="url(#surface)" stroke="#777b7d" stroke-width="3"/>
    <rect x="76" y="66" width="1048" height="1012" rx="9" fill="none" stroke="#28292c" stroke-opacity="0.52" stroke-width="4"/>
  </g>

  <!-- A small, neutral indicator balances the otherwise unbranded top panel. -->
  <g transform="translate(600 94)" fill="#55caf6">
    <rect x="-30" y="-3" width="22" height="6" rx="3"/>
    <rect x="-3" y="-3" width="6" height="6" rx="3"/>
    <rect x="8" y="-3" width="22" height="6" rx="3"/>
  </g>

  <g aria-label="Four rotary encoders">
    <g transform="translate(330 210)"><use href="#encoder"/><circle r="76" fill="none" stroke="#8ca5ff" stroke-width="3"/></g>
    <g transform="translate(520 210)"><use href="#encoder"/></g>
    <g transform="translate(710 210)"><use href="#encoder"/></g>
    <g transform="translate(900 210)"><use href="#encoder"/></g>
    <text class="encoder-number" x="330" y="322">1</text>
    <text class="encoder-number" x="520" y="322">2</text>
    <text class="encoder-number" x="710" y="322">3</text>
    <text class="encoder-number" x="900" y="322">4</text>
  </g>

  <g aria-label="Left controls">
    <g transform="translate(100 110)">
      <rect class="group-box" width="104" height="190" rx="10"/><path class="group-head" d="M10 0 H94 Q104 0 104 10 V32 H0 V10 Q0 0 10 0Z"/><text class="group-title" x="52" y="21">SONG</text>
      <g transform="translate(15 48)"><use href="#orangeControl"/><text class="control-label" x="37.5" y="23.5">Setup</text></g>
      <g transform="translate(15 126)"><use href="#orangeControl"/><text class="control-label" x="37.5" y="23.5">Set Loop</text></g>
    </g>
    <g transform="translate(100 310)">
      <rect class="group-box" width="104" height="190" rx="10"/><path class="group-head" d="M10 0 H94 Q104 0 104 10 V32 H0 V10 Q0 0 10 0Z"/><text class="group-title" x="52" y="21">EVENT</text>
      <g transform="translate(15 48)"><use href="#orangeControl"/><text class="control-label" x="37.5" y="23.5">Editor</text></g>
      <g transform="translate(15 126)"><use href="#orangeControl"/><text class="control-label small" x="37.5" y="19">Nudge</text><text class="control-label small" x="37.5" y="31">Quantize</text></g>
    </g>
    <g transform="translate(100 510)">
      <rect class="group-box" width="104" height="275" rx="10"/><path class="group-head" d="M10 0 H94 Q104 0 104 10 V32 H0 V10 Q0 0 10 0Z"/><text class="group-title" x="52" y="21">INST</text>
      <g transform="translate(15 48)"><use href="#orangeControl"/><text class="control-label small" x="37.5" y="19">Show /</text><text class="control-label small" x="37.5" y="31">Hide</text></g>
      <g transform="translate(15 133)"><use href="#orangeControl"/><text class="control-label small" x="37.5" y="19">Preset +/−</text><text class="control-label small" x="37.5" y="31">Focus</text></g>
      <g transform="translate(15 218)"><use href="#orangeControl"/><text class="control-label" x="37.5" y="23.5">Bank</text></g>
    </g>
    <g transform="translate(100 795)">
      <rect class="group-box" width="104" height="190" rx="10"/><path class="group-head" d="M10 0 H94 Q104 0 104 10 V32 H0 V10 Q0 0 10 0Z"/><text class="group-title" x="52" y="21">MODE</text>
      <g transform="translate(15 48)"><use href="#redControl"/><text class="control-label" x="37.5" y="23.5">Full Level</text></g>
      <g transform="translate(15 126)"><use href="#redControl"/><text class="control-label small" x="37.5" y="19">Note</text><text class="control-label small" x="37.5" y="31">Repeat</text></g>
    </g>
    <g transform="translate(115 1012)"><use href="#shiftControl"/><text class="control-label light" x="37.5" y="23.5">Shift</text></g>
  </g>

  <g aria-label="Sixteen RGB pads">
    <g transform="translate(250 340)"><use href="#offPad"/><rect class="number-box" x="12" y="12" width="30" height="25"/><text class="pad-number" x="27" y="24.5">13</text><text class="off-name" x="50" y="30">UNUSED</text></g>
    <g transform="translate(440 340)" color="#91aaf6"><rect x="-5" y="-5" width="170" height="170" rx="8" fill="none" stroke="#c0ccff" stroke-width="4" filter="url(#padGlow)"/><use href="#litPad"/><rect class="number-box" x="12" y="12" width="30" height="25"/><text class="pad-number" x="27" y="24.5">14</text><text class="pad-name" x="50" y="27">TASK 1</text><text class="pad-state" x="50" y="43">THINKING</text></g>
    <g transform="translate(630 340)" color="#f8f9fd"><use href="#litPad"/><rect class="number-box" x="12" y="12" width="30" height="25"/><text class="pad-number" x="27" y="24.5">15</text><text class="pad-name" x="50" y="27">TASK 2</text><text class="pad-state" x="50" y="43">IDLE</text></g>
    <g transform="translate(820 340)"><use href="#offPad"/><rect class="number-box" x="12" y="12" width="30" height="25"/><text class="pad-number" x="27" y="24.5">16</text><text class="off-name" x="50" y="30">UNUSED</text></g>

    <g transform="translate(250 530)" color="#61d86b"><use href="#litPad"/><rect class="number-box" x="12" y="12" width="30" height="25"/><text class="pad-number" x="27" y="24.5">9</text><text class="pad-name" x="50" y="27">TASK 3</text><text class="pad-state" x="50" y="43">COMPLETE</text></g>
    <g transform="translate(440 530)" color="#ffda79"><use href="#litPad"/><rect class="number-box" x="12" y="12" width="30" height="25"/><text class="pad-number" x="27" y="24.5">10</text><text class="pad-name" x="50" y="27">TASK 4</text><text class="pad-state" x="50" y="43">NEEDS INPUT</text></g>
    <g transform="translate(630 530)" color="#fa86b5"><use href="#litPad"/><rect class="number-box" x="12" y="12" width="30" height="25"/><text class="pad-number" x="27" y="24.5">11</text><text class="pad-name" x="50" y="27">TASK 5</text><text class="pad-state" x="50" y="43">ERROR</text></g>
    <g transform="translate(820 530)" color="#91aaf6"><use href="#litPad"/><rect class="number-box" x="12" y="12" width="30" height="25"/><text class="pad-number" x="27" y="24.5">12</text><text class="pad-name" x="50" y="27">TASK 6</text><text class="pad-state" x="50" y="43">THINKING</text></g>

    <g transform="translate(250 720)" color="#ffe56f"><use href="#litPad"/><rect class="number-box" x="12" y="12" width="30" height="25"/><text class="pad-number" x="27" y="24.5">5</text><text class="pad-name" x="50" y="27">FAST</text></g>
    <g transform="translate(440 720)" color="#84e49d"><use href="#litPad"/><rect class="number-box" x="12" y="12" width="30" height="25"/><text class="pad-number" x="27" y="24.5">6</text><text class="pad-name" x="50" y="27">APPROVE</text></g>
    <g transform="translate(630 720)" color="#ff858b"><use href="#litPad"/><rect class="number-box" x="12" y="12" width="30" height="25"/><text class="pad-number" x="27" y="24.5">7</text><text class="pad-name" x="50" y="27">REJECT</text></g>
    <g transform="translate(820 720)" color="#bd91ed"><use href="#litPad"/><rect class="number-box" x="12" y="12" width="30" height="25"/><text class="pad-number" x="27" y="24.5">8</text><text class="pad-name" x="50" y="27">FORK</text></g>

    <g transform="translate(250 910)"><use href="#offPad"/><rect class="number-box" x="12" y="12" width="30" height="25"/><text class="pad-number" x="27" y="24.5">1</text><text class="off-name" x="50" y="30">UNUSED</text></g>
    <g transform="translate(440 910)" color="#fbfcff"><use href="#litPad"/><rect class="number-box" x="12" y="12" width="30" height="25"/><text class="pad-number" x="27" y="24.5">2</text><text class="pad-name" x="50" y="27">MIC</text></g>
    <g transform="translate(630 910)" color="#fbfcff"><use href="#litPad"/><rect class="number-box" x="12" y="12" width="30" height="25"/><text class="pad-number" x="27" y="24.5">3</text><text class="pad-name" x="50" y="27">MIC</text></g>
    <g transform="translate(820 910)" color="#718cff"><use href="#litPad"/><rect class="number-box" x="12" y="12" width="30" height="25"/><text class="pad-number" x="27" y="24.5">4</text><text class="pad-name" x="50" y="27">SUBMIT</text></g>
  </g>

  <g aria-label="Right controls">
    <g transform="translate(1020 110)">
      <rect class="group-box" width="104" height="550" rx="10"/><path class="group-head" d="M10 0 H94 Q104 0 104 10 V32 H0 V10 Q0 0 10 0Z"/><text class="group-title" x="52" y="21">NAV</text>
      <g transform="translate(15 48)"><use href="#orangeControl"/><text class="control-label" x="37.5" y="23.5">Up</text></g>
      <g transform="translate(15 138)"><use href="#orangeControl"/><text class="control-label" x="37.5" y="23.5">Down</text></g>
      <g transform="translate(15 228)"><use href="#orangeControl"/><text class="control-label" x="37.5" y="23.5">Left</text></g>
      <g transform="translate(15 318)"><use href="#orangeControl"/><text class="control-label" x="37.5" y="23.5">Right</text></g>
      <g transform="translate(15 408)"><use href="#greenControl"/><text class="control-label" x="37.5" y="23.5">Select</text></g>
      <g transform="translate(15 493)"><use href="#orangeControl"/><text class="control-label" x="37.5" y="23.5">Zoom</text></g>
    </g>
    <circle cx="1072" cy="700" r="22" fill="url(#encoderCenter)" stroke="#171719" stroke-width="2" filter="url(#controlShadow)"/>
    <text class="quick-label" x="1099" y="704">Setup</text>
    <g transform="translate(1020 740)">
      <rect class="group-box" width="104" height="335" rx="10"/><path class="group-head" d="M10 0 H94 Q104 0 104 10 V32 H0 V10 Q0 0 10 0Z"/><text class="group-title" x="52" y="21">TRANS</text>
      <g transform="translate(15 48)"><use href="#blueControl"/><text class="control-label small" x="37.5" y="19">Click</text><text class="control-label small" x="37.5" y="31">Count In</text></g>
      <g transform="translate(15 121)"><use href="#redControl"/><text class="control-label small" x="37.5" y="19">Record</text><text class="control-label small" x="37.5" y="31">Save</text></g>
      <g transform="translate(15 194)"><use href="#greenControl"/><text class="control-label small" x="37.5" y="19">Play</text><text class="control-label small" x="37.5" y="31">Loop</text></g>
      <g transform="translate(15 267)"><use href="#orangeControl"/><text class="control-label small" x="37.5" y="19">Stop</text><text class="control-label small" x="37.5" y="31">Undo</text></g>
    </g>
  </g>
</svg>
